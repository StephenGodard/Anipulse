[project]
name = "anipulse"
version = "0.1.0"
description = "Autonomous content planning agent for AnimeSphere."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "requests>=2.32"
]

[project.scripts]
anipulse = "anipulse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
