name: AniPulse daily planning

on:
  workflow_dispatch:
  schedule:
    # 08:30 Europe/Paris during summer time.
    - cron: "30 6 * * *"

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AniPulse
        run: python -m pip install -e .
      - name: Run AniPulse
        env:
          ANIPULSE_SOURCE: x-api
          ANIPULSE_DRY_RUN: ${{ vars.ANIPULSE_DRY_RUN || 'false' }}
          ANIPULSE_DAILY_LIMIT: ${{ vars.ANIPULSE_DAILY_LIMIT || '4' }}
          ANIPULSE_TIMEZONE: Europe/Paris
          ANIPULSE_TRACKED_TITLES: ${{ vars.ANIPULSE_TRACKED_TITLES || 'Re:Zero,Classroom of the Elite,Black Clover,Marriagetoxin,MARRIAGE TOXIN' }}
          X_API_TOKEN: ${{ secrets.X_API_TOKEN }}
          X_ACCOUNTS: ${{ vars.X_ACCOUNTS || 'shirotaku_fr,Tokanim_FR,gaak_fr,animotaku_fr' }}
          X_MAX_RESULTS: ${{ vars.X_MAX_RESULTS || '10' }}
          X_LOOKBACK_HOURS: ${{ vars.X_LOOKBACK_HOURS || '24' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_CONTENT_CALENDAR_DB_ID: ${{ secrets.NOTION_CONTENT_CALENDAR_DB_ID }}
          NOTION_FALLBACK_PAGE_ID: ${{ vars.NOTION_FALLBACK_PAGE_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          RESEND_TO_EMAIL: ${{ vars.RESEND_TO_EMAIL }}
        run: anipulse --write --export-dir exports
      - uses: actions/upload-artifact@v4
        with:
          name: anipulse-exports
          path: exports/
